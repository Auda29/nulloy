name: Packaged Explorer cold and warm matrix

on:
  push:
    branches: ['test/windows-open-acceptance']
    paths:
      - '.github/workflows/open-matrix.yml'
      - 'tools/desktop-probe/**'
  workflow_dispatch:
    inputs:
      package_run:
        description: Completed combined build run containing the Qt6 package
        type: string
        required: true
      package_sha:
        description: Exact source commit in that package manifest
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tools/desktop-probe -p 'test_*.py' -v

  explorer:
    if: github.event_name == 'workflow_dispatch'
    needs: contracts
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pywinauto==0.6.9 Pillow==11.3.0 psutil==7.0.0
      - name: Verify native registry handle and probe contracts
        run: python -B -m unittest discover -s tools/desktop-probe -p 'test_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run }}
          name: Nulloy-Qt6-windows-x64
          path: package
      - name: Run cold and warm preference matrix plus larger selection
        shell: pwsh
        env:
          PACKAGE_SHA: ${{ inputs.package_sha }}
        run: |
          $packages = @(Get-ChildItem package -Filter '*.zip' -Recurse)
          if ($packages.Count -ne 1) { throw "Expected one package" }
          $failed = $false
          foreach ($warm in @($false, $true)) {
            foreach ($enqueue in @('false', 'true')) {
              foreach ($play in @('false', 'true')) {
                $name = "warm-$warm-enqueue-$enqueue-play-$play"
                $arguments = @('--package', $packages[0].FullName, '--source-sha', $env:PACKAGE_SHA,
                  '--output', "evidence/$name", '--headless-audio', '--trace-startup', '--enqueue', $enqueue, '--play-enqueued', $play)
                if ($warm) { $arguments += '--warm-start' }
                python tools/desktop-probe/probe.py @arguments
                if ($LASTEXITCODE -ne 0) { $failed = $true }
                $result = Get-Content "evidence/$name/result.json" -Raw | ConvertFrom-Json
                if (-not $result.cleanup_verified) { throw "Cleanup unverified; stop matrix at $name" }
              }
            }
          }
          python tools/desktop-probe/probe.py --package $packages[0].FullName --source-sha $env:PACKAGE_SHA --output evidence/large-selection --headless-audio --trace-startup --enqueue false --play-enqueued true --fixture-count 12
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { exit 1 }
      - name: Preserve every matrix result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-open-matrix
          path: evidence/
          retention-days: 7
