name: PR15 bounded player characterization

on:
  workflow_dispatch:
    inputs:
      characterize_package:
        description: Run the bounded PR15 package characterization
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: pr15-player-characterize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  characterize:
    if: github.event_name == 'workflow_dispatch' && inputs.characterize_package == true
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned inspection dependencies
        run: python -m pip install pywinauto==0.6.9 psutil==7.0.0 Pillow==11.1.0

      - name: Run exact CI inspector contract discovery
        run: python -m unittest discover -s tools/player-inspection -p 'test_*.py' -v

      - name: Download exact PR15 package artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Auda29/nulloy
          run-id: 34878321503
          artifact-ids: 10362585867
          path: package-archive

      - name: Verify exact artifact metadata and extracted package shape
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $expectedArtifactId = 10362585867
          $expectedOuterSha256 = "ce1d7aad25d939902669e0150ec81a38befe7031644c47b01b2cde0b0ff185a0"
          $expectedInnerSha256 = "23b3e646ac0f8a69d4d8e434c4441a0b3d06101f56940211caba28b2385f05b0"
          $expectedSourceSha = "774894c4eba7b646beafb38313fe0dc73cfb4671"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $metadata = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/Auda29/nulloy/actions/artifacts/$expectedArtifactId" -Headers $headers
          if ([int64]$metadata.id -ne $expectedArtifactId) { throw "Unexpected artifact ID: $($metadata.id)" }
          if ($metadata.digest -ne "sha256:$expectedOuterSha256") { throw "Unexpected outer artifact digest: $($metadata.digest)" }
          $packages = @(Get-ChildItem package-archive -Filter "NulloyFork-0.10.0-alpha.2-windows-x64.zip" -Recurse -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one extracted PR15 inner package, found $($packages.Count)" }
          $package = $packages[0]
          $innerSha256 = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($innerSha256 -ne $expectedInnerSha256) { throw "Inner package SHA-256 mismatch: $innerSha256" }
          $bindings = @(Get-ChildItem package-archive -Filter "acceptance-binding.json" -Recurse -File)
          if ($bindings.Count -ne 1) { throw "Expected exactly one acceptance binding, found $($bindings.Count)" }
          $binding = Get-Content $bindings[0].FullName -Raw | ConvertFrom-Json
          if ($binding.product_source_sha -cne $expectedSourceSha) { throw "Acceptance binding source mismatch" }
          if ($binding.package_sha256 -cne $expectedInnerSha256) { throw "Acceptance binding package mismatch" }
          if ($binding.source_assertion -cne "PASS") { throw "Acceptance binding source assertion is not PASS" }
          "NULLOY_PACKAGE_PATH=$($package.FullName)" >> $env:GITHUB_ENV

      - name: Verify existing archive helper against inner package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $helperDestination = Join-Path $env:RUNNER_TEMP "pr15-characterize-helper"
          New-Item -ItemType Directory -Path $helperDestination -Force | Out-Null
          $env:PR15_HELPER_DESTINATION = $helperDestination
          python -c "from pathlib import Path; import os; import sys; sys.path.insert(0, 'tools/player-inspection'); from inspect_player import extract_and_validate; result = extract_and_validate(Path(os.environ['NULLOY_PACKAGE_PATH']), Path(os.environ['PR15_HELPER_DESTINATION']), '774894c4eba7b646beafb38313fe0dc73cfb4671'); print(result.archive_sha256)"
          if ($LASTEXITCODE -ne 0) { throw "Existing archive helper rejected the exact PR15 inner package" }

      - name: Run bounded read-only inspector
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Get-Item -LiteralPath $env:NULLOY_PACKAGE_PATH
          python tools/player-inspection/inspect_player.py --package $package.FullName --output evidence-bounded-read-only --source-sha 774894c4eba7b646beafb38313fe0dc73cfb4671 --archive-sha256 23b3e646ac0f8a69d4d8e434c4441a0b3d06101f56940211caba28b2385f05b0 --bounded-read-only
          exit $LASTEXITCODE

      - name: Run bounded context-menu inspector
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Get-Item -LiteralPath $env:NULLOY_PACKAGE_PATH
          python tools/player-inspection/inspect_player.py --package $package.FullName --output evidence-bounded-context-menu --source-sha 774894c4eba7b646beafb38313fe0dc73cfb4671 --archive-sha256 23b3e646ac0f8a69d4d8e434c4441a0b3d06101f56940211caba28b2385f05b0 --bounded-context-menu
          exit $LASTEXITCODE

      - name: Preserve characterization evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr15-player-characterization-${{ github.run_id }}
          path: |
            evidence-bounded-read-only/
            evidence-bounded-context-menu/
          if-no-files-found: warn
          retention-days: 7
