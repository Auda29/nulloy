name: PR24 updated-candidate playback and IPC acceptance

on:
  push:
    branches: ['test/pr24-playback-acceptance']
    paths:
      - '.github/workflows/pr24-candidate-acceptance.yml'
      - 'tools/ci/test-pr24-candidate-workflow.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python tools/ci/test-pr24-candidate-workflow.py
      - run: python -B -m unittest discover -s tools/desktop-probe -p 'test_*.py'
  windows:
    needs: contracts
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        probe: [populated, restored, commands, ipc]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pywinauto==0.6.9 Pillow==11.3.0 psutil==7.0.0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '36995053598'
          name: Nulloy-Qt6-windows-x64
          path: package
      - name: Observe exact unmodified PR candidate
        shell: pwsh
        env:
          PROBE: ${{ matrix.probe }}
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $packages = @(Get-ChildItem package -Filter '*.zip' -Recurse)
          if ($packages.Count -ne 1) { throw 'Expected one candidate package' }
          $hash = (Get-FileHash $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '2327a4a5e5599e7788f595c4babb83595aef37939d2375b8c72cca1edf53614f') { throw 'Candidate package mismatch' }
          @{run=$env:GITHUB_RUN_ID; probe=$env:GITHUB_SHA; zip_sha256=$hash; package_run='36995053598'; candidate='7b292852a85bd6a40a99cd7d7813660250ed5b3d'; scope='populated, settled restored, commands and IPC; manual risks accepted separately'; audio_hardware_tested=$false; windows11_tested=$false} | ConvertTo-Json | Set-Content evidence/runner.json
          if ($env:PROBE -eq 'ipc') {
            python tools/desktop-probe/pr24_ipc.py --package $packages[0].FullName --source-sha 7b292852a85bd6a40a99cd7d7813660250ed5b3d --output evidence --case all --headless-audio
          } else {
            python tools/desktop-probe/pr24_playback.py --package $packages[0].FullName --source-sha 7b292852a85bd6a40a99cd7d7813660250ed5b3d --output evidence --group $env:PROBE --headless-audio --case-timeout 180
          }
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr24-candidate-${{ matrix.probe }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
