name: Combined PR24 and PR29 Windows acceptance

on:
  push:
    branches: ['test/windows-open-acceptance']
    paths:
      - 'src/**'
      - '3rdParty/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  listen-regression:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-qt6-base
      - name: Verify fixed receiver and old-code regression
        shell: msys2 {0}
        run: |
          cmake -S tests/single-instance-startup -B race-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(cygpath -m /mingw64)"
          cmake --build race-build -j 2
          export QT_QPA_PLATFORM=offscreen
          race-build/testSingleInstanceStartup.exe -o race-build/fixed-results.txt,txt
          git show 13bae8bb241b93360787fa925acd4b1007e1a8ef:3rdParty/qtsingleapplication-8fd81b2/src/qtlocalpeer.cpp > 3rdParty/qtsingleapplication-8fd81b2/src/qtlocalpeer.cpp
          cmake --build race-build -j 2
          if race-build/testSingleInstanceStartup.exe windowsConnectionAcceptedInsideListenIsDelivered -o race-build/old-results.txt,txt; then
            echo 'Old receiver unexpectedly passed the listen-time regression'
            exit 1
          fi
          grep -E 'Actual.*received' race-build/old-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listen-race-red-green
          path: race-build/*-results.txt
          retention-days: 7

  build:
    uses: ./.github/workflows/windows-cmake.yml
    with:
      upload_packages: true

  linux:
    uses: ./.github/workflows/upstream-stabilization.yml

  explorer:
    name: Combined packaged Explorer diagnostic
    needs: build
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned desktop dependencies
        run: python -m pip install pywinauto==0.6.9 Pillow==11.3.0 psutil==7.0.0
      - name: Verify probe contracts
        run: python -B -m unittest discover -s tools/desktop-probe -p 'test_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: Nulloy-Qt6-windows-x64
          path: .desktop-probe/package
      - name: Exercise combined package through real Explorer
        shell: pwsh
        env:
          PROBE_SOURCE_SHA: ${{ github.sha }}
        run: |
          $packages = @(Get-ChildItem .desktop-probe/package -Filter '*.zip' -Recurse)
          if ($packages.Count -ne 1) { throw "Expected one package, got $($packages.Count)" }
          python tools/desktop-probe/probe.py --package $packages[0].FullName --output .desktop-probe/evidence --source-sha $env:PROBE_SOURCE_SHA --headless-audio --trace-startup
          exit $LASTEXITCODE
      - name: Preserve exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-open-desktop-evidence
          path: |
            .desktop-probe/evidence/*.json
            .desktop-probe/evidence/*.jsonl
            .desktop-probe/evidence/*.txt
            .desktop-probe/evidence/*.png
            .desktop-probe/evidence/*.sha256
            .desktop-probe/evidence/startup-trace/*.jsonl
          if-no-files-found: warn
          retention-days: 7
