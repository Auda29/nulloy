name: Windows x64 CMake

on:
  push:
    branches: [master, 'codex/phase-2-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-imagemagick
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-script
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-winextras
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-good
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-zlib
      - name: Configure, build and test
        shell: msys2 {0}
        run: |
          cmake -S . -B .phase2/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(cygpath -m /mingw64)"
          cmake --build .phase2/build -j 4
          ctest --test-dir .phase2/build --output-on-failure
          pacman -Q > .phase2/build/toolchain.txt
      - name: Package and verify without toolchain PATH
        shell: msys2 {0}
        run: |
          python tools/phase2/package-windows.py --prefix "$(cygpath -m /mingw64)" --build .phase2/build --source .
          python tools/phase2/verify-package.py --prefix "$(cygpath -m /mingw64)" --build .phase2/build
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: Nulloy-windows-x64
          path: |
            .phase2/build/Nulloy-windows-x64.zip
            .phase2/build/Nulloy-windows-x64.zip.sha256
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-evidence
          path: |
            .phase2/build/*-results.txt
            .phase2/build/toolchain.txt
            .phase2/build/package-check/
            .phase2/build/Testing/Temporary/LastTest.log
