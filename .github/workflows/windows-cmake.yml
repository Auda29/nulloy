name: Windows x64 CMake

on:
  push:
    branches: [master, 'codex/phase-2-*', 'codex/phase-3-*', 'codex/phase-4-*']
  pull_request:
  workflow_dispatch:
    inputs:
      upload_packages:
        description: 'Upload Qt5/Qt6 packages for a planned acceptance run (3 days)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      upload_packages:
        description: 'Explicitly retain packages for the calling workflow'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - qt: 5
            preset: windows-x64
            build: .phase2/build
            qt-packages: mingw-w64-x86_64-qt5-base mingw-w64-x86_64-qt5-script mingw-w64-x86_64-qt5-svg mingw-w64-x86_64-qt5-tools mingw-w64-x86_64-qt5-winextras
          - qt: 6
            preset: windows-portable-x64
            build: .phase4/build
            qt-packages: mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-declarative mingw-w64-x86_64-qt6-svg mingw-w64-x86_64-qt6-tools mingw-w64-x86_64-qt6-5compat
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Keep checkout Git for package provenance
        shell: pwsh
        run: |
          "NULLOY_GIT_EXECUTABLE=$((Get-Command git).Source)" >> $env:GITHUB_ENV
          git status --short
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-imagemagick
            mingw-w64-x86_64-librsvg
            ${{ matrix.qt-packages }}
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-good
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-zlib
      - name: Configure, build and test
        shell: msys2 {0}
        run: |
          mkdir -p ${{ matrix.build }}
          pacman -Q > ${{ matrix.build }}/toolchain.txt
          cmake --preset ${{ matrix.preset }} -DCMAKE_PREFIX_PATH="$(cygpath -m /mingw64)"
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }}
          python tools/phase4/test-import-profile.py
          python tools/release/test-alpha.py
      - name: Package and verify without toolchain PATH
        shell: msys2 {0}
        run: |
          python tools/phase2/package-windows.py --prefix "$(cygpath -m /mingw64)" --build ${{ matrix.build }} --source .
          python tools/phase2/verify-package.py --prefix "$(cygpath -m /mingw64)" --build ${{ matrix.build }} --headless-audio
      - name: Verify portable startup and registry recovery
        if: matrix.qt == 6
        shell: msys2 {0}
        run: |
          python tools/phase2/verify-package.py --prefix "$(cygpath -m /mingw64)" --build ${{ matrix.build }} --headless-audio --trace-startup --repeat 3
          for mode in missing corrupt changed-plugin; do
            python tools/phase2/verify-package.py --prefix "$(cygpath -m /mingw64)" --build ${{ matrix.build }} --headless-audio --trace-startup --registry-fallback "$mode"
          done
      - name: Verify audio formats and Unicode tag roundtrips
        shell: msys2 {0}
        run: |
          python tools/phase3/build-format-fixtures.py --prefix "$(cygpath -m /mingw64)" --build ${{ matrix.build }}
          python tools/phase2/verify-package.py --prefix "$(cygpath -m /mingw64)" --build ${{ matrix.build }} --format-fixtures ${{ matrix.build }}/format-fixtures --headless-audio
      - name: Test shared Qt 6 skin adapters
        if: matrix.qt == 6
        shell: msys2 {0}
        run: |
          cmake -S experiments/qt6-skins -B .phase3/skin-probe -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(cygpath -m /mingw64)"
          cmake --build .phase3/skin-probe -j 4
          ctest --test-dir .phase3/skin-probe --output-on-failure
      - name: Upload test package
        if: ${{ inputs.upload_packages == true }}
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: Nulloy-Qt${{ matrix.qt }}-windows-x64
          path: |
            ${{ matrix.build }}/*-windows-x64.zip
            ${{ matrix.build }}/*-windows-x64.zip.sha256
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Qt${{ matrix.qt }}-test-evidence
          retention-days: 7
          path: |
            ${{ matrix.build }}/*-results.txt
            ${{ matrix.build }}/toolchain.txt
            ${{ matrix.build }}/package-check/
            ${{ matrix.build }}/format-check/
            ${{ matrix.build }}/startup-check*/
            ${{ matrix.build }}/package-info.json
            ${{ matrix.build }}/Testing/Temporary/LastTest.log
            .phase3/skin-probe/*-results.txt
