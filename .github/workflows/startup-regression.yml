name: Windows startup red-green regressions

on:
  push:
    branches: ['test/windows-open-acceptance']
    paths:
      - '.github/workflows/startup-regression.yml'
      - '3rdParty/qtsingleapplication-8fd81b2/src/qtlocalpeer.cpp'
      - 'tests/single-instance-startup/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-qt6-base
      - name: Verify fixed receiver and old-code regressions
        shell: msys2 {0}
        run: |
          cmake -S tests/single-instance-startup -B race-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(cygpath -m /mingw64)"
          cmake --build race-build -j 2
          export QT_QPA_PLATFORM=offscreen
          race-build/testSingleInstanceStartup.exe -o race-build/fixed-results.txt,txt
          git show 13bae8bb241b93360787fa925acd4b1007e1a8ef:3rdParty/qtsingleapplication-8fd81b2/src/qtlocalpeer.cpp > 3rdParty/qtsingleapplication-8fd81b2/src/qtlocalpeer.cpp
          for source in qtlocalpeer.h qtsingleapplication.h qtsingleapplication.cpp; do
            git show 13bae8bb241b93360787fa925acd4b1007e1a8ef:3rdParty/qtsingleapplication-8fd81b2/src/$source > 3rdParty/qtsingleapplication-8fd81b2/src/$source
          done
          # Freeze the two original regression cases for the old API; new
          # background-reception cases above exercise both enabled/disabled IO.
          git show ba414e0cb3db93ce6b63f3cedc6ea7a35037f9be:tests/single-instance-startup/testSingleInstanceStartup.cpp > tests/single-instance-startup/testSingleInstanceStartup.cpp
          cmake --build race-build -j 2
          if race-build/testSingleInstanceStartup.exe windowsConnectionAcceptedInsideListenIsDelivered -o race-build/old-results.txt,txt; then
            echo 'Old receiver unexpectedly passed the listen-time regression'
            exit 1
          fi
          grep -E 'Actual.*received' race-build/old-results.txt
          if race-build/testSingleInstanceStartup.exe windowsShortAndLongExecutablePathsShareIdentity -o race-build/old-identity-results.txt,txt; then
            echo 'Old receiver unexpectedly passed the short-path identity regression'
            exit 1
          fi
          grep -E 'Actual.*identity\(shortPath\)' race-build/old-identity-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-red-green
          path: race-build/*-results.txt
          retention-days: 7
